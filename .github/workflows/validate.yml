name: HCDF Schema Validation

on:
  push:
    branches: [main]
    paths:
      - '*.xsd'
      - 'extensions/*.xsd'
      - 'examples/**'
      - 'tests/**'
      - '*.py'
      - 'convert.py'
      - 'scripts/**'
      - 'hcdfdom/**'
      - 'urdf_hcdf/**'
      - 'hcdf_io/**'
      - 'sdf_io/**'
      - 'versions/**'
  pull_request:
    branches: [main]
    paths:
      - '*.xsd'
      - 'extensions/*.xsd'
      - 'examples/**'
      - 'tests/**'
      - '*.py'
      - 'convert.py'
      - 'scripts/**'
      - 'hcdfdom/**'
      - 'urdf_hcdf/**'
      - 'hcdf_io/**'
      - 'sdf_io/**'
      - 'versions/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install lxml numpy trimesh pygltflib

      - name: Run test suite
        run: python3 tests/run_tests.py

      - name: Regenerate spec and check for drift
        run: |
          python3 generate_spec_html.py hcdf.xsd spec.html.new
          diff spec.html spec.html.new || (echo "spec.html is out of date — regenerate with: python3 generate_spec_html.py hcdf.xsd spec.html" && exit 1)
          rm spec.html.new

      - name: Regenerate JSON schema and check for drift
        run: |
          python3 generate_json_schema.py hcdf.xsd hcdf.schema.json.new
          diff hcdf.schema.json hcdf.schema.json.new || (echo "hcdf.schema.json is out of date — regenerate with: python3 generate_json_schema.py hcdf.xsd hcdf.schema.json" && exit 1)
          rm hcdf.schema.json.new

      - name: Regenerate hcdfdom model and check for drift
        run: |
          python3 generate_hcdfdom.py hcdf.xsd hcdfdom/model.py.new
          diff hcdfdom/model.py hcdfdom/model.py.new || (echo "hcdfdom/model.py is out of date — regenerate with: python3 generate_hcdfdom.py hcdf.xsd hcdfdom/model.py" && exit 1)
          rm hcdfdom/model.py.new

      - name: hcdfdom typed-DOM round-trip
        run: python3 tests/test_hcdfdom.py

      - name: hcdfdom companion validator
        run: python3 tests/test_validator.py

      - name: hcdfdom pose/frame normalizer
        run: python3 tests/test_frames.py

      - name: urdf_hcdf URDF -> HCDF import
        run: python3 tests/test_urdf_io.py

      - name: urdf_hcdf round-trip + loss manifest
        run: python3 tests/test_urdf_roundtrip.py

      - name: urdf_hcdf export-loss completeness
        run: python3 tests/test_urdf_export_losses.py

      - name: urdf_hcdf loss manifest + HCDF-URDF profile checker
        run: python3 tests/test_profile.py

      - name: hcdf_io include flattening + JSON
        run: python3 tests/test_hcdf_io.py

      - name: assets mesh -> GLB pipeline
        run: python3 tests/test_assets.py

      - name: sdf_io SDF <-> HCDF spoke
        run: python3 tests/test_sdf_io.py

      - name: Check version archive integrity (hash pin + frozen)
        run: python3 scripts/check_version_hashes.py
