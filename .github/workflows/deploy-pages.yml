name: Deploy Website to GitHub Pages

# Publish the HCDF documentation, generated schema references, and downloadable example corpus.
# HCDViz and Dendrite Build are deployed independently from their own repositories.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'hcdf.xsd'
      - 'hcdf-stream-profile.xsd'
      - 'extensions/*.xsd'
      - 'rust/hcdformat-rs/**'
      - 'examples/*.hcdf'
      - 'examples/models/**'
      - 'examples/profiles/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/hcdformat-rs

      # Build the native `hcdf` CLI from THIS checkout, then regenerate the six spec pages with its
      # pure-Rust `regen spec` (no Python/lxml). Ordered after the Rust toolchain install above and
      # before the pages are assembled/uploaded below.
      - name: Build the hcdf CLI
        run: cargo build --locked --release --manifest-path rust/hcdformat-rs/Cargo.toml --features cli --bin hcdf

      - name: Regenerate spec pages from XSD
        run: |
          HCDF=rust/hcdformat-rs/target/release/hcdf
          "$HCDF" regen spec hcdf.xsd website/spec/core.html
          "$HCDF" regen spec hcdf-stream-profile.xsd website/spec/stream-profile.html
          "$HCDF" regen spec extensions/hcdf-ext-ros2.xsd website/spec/extensions/ros2.html
          "$HCDF" regen spec extensions/hcdf-ext-ros2-control.xsd website/spec/extensions/ros2-control.html
          "$HCDF" regen spec extensions/hcdf-ext-gazebo.xsd website/spec/extensions/gazebo.html
          "$HCDF" regen spec extensions/hcdf-ext-1722.xsd website/spec/extensions/1722.html

      - name: Assemble the site
        run: |
          mkdir -p website/examples/files
          cp examples/*.hcdf website/examples/files/
          cp -r examples/models website/examples/files/
          cp -r examples/profiles website/examples/files/
          HCDF=rust/hcdformat-rs/target/release/hcdf
          "$HCDF" bundle examples/dm-j8009p-openarm-j1.hcdf website/examples/files/dm-j8009p-openarm-j1.hcdfz
          "$HCDF" bundle-verify website/examples/files/dm-j8009p-openarm-j1.hcdfz

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
