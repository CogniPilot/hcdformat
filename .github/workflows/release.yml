name: Release to PyPI

# Publishes a wheel and sdist when a version tag is pushed (e.g. v1.0.0). Uses PyPI Trusted
# Publishing (OIDC), so no API token is stored: configure hcdformat as a trusted publisher on PyPI
# for this repository and the `pypi` environment first.
on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Smoke test the built wheel (incl. the JSON path that reads hcdf.xsd)
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install "$(ls dist/*.whl)[mesh]"
          /tmp/v/bin/hcdf --version
          /tmp/v/bin/hcdf convert tests/urdf/example-arm.urdf /tmp/a.hcdf
          /tmp/v/bin/hcdf convert /tmp/a.hcdf /tmp/a.json
          /tmp/v/bin/hcdf convert /tmp/a.json /tmp/a2.hcdf

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # required for Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
